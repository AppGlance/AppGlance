# Publishes a GitHub Release for every version tag, with the matching CHANGELOG.md section as
# its notes - but only after the full CI matrix (lint, builds, tests) has passed in this same
# run, so a tag with a red suite cannot publish. Releasing is: move the [Unreleased] entries
# under a new version heading, commit, `git tag 1.2.3 && git push origin main 1.2.3`.
name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  github-release:
    name: GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v v="$version" '
            /^## \[/ { printing = ($0 ~ "^## \\[" v "\\]") ; next }
            printing { print }
          ' CHANGELOG.md | sed -e '1{/^$/d;}' > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$(case "$GITHUB_REF_NAME" in *-*) echo --prerelease ;; esac)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
          fi
